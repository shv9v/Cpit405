<!DOCTYPE html>
<html lang="en">
  <header>
    <h1>Unsplashed Image Search</h1>
    <input id="inputBox" type="text" placeholder="Enter any image title" />
    <button onclick="searchUsingXHR()">Search using XHR</button>
    <button onclick="searchUsingFetch()">Search using fetch</button>
    <button onclick="searchUsingFetchAwaitAsync()">
      Search using fetch with await/async
    </button>
  </header>
  <h2 id="title">search resullt</h2>
  <p id="message" role="status"></p>
  <samp id="sampleOutput"></samp>
  <script >
// Replace with your own Unsplash Access Key (not the Secret Key).
var accessKey = "bJESqwNB9fVd_d52xZeuaifsl-Q3H6KCbnDXMZQmBWo";
var lastSearchMethod = searchUsingFetch;

// Display images by creating HTML elements using the DOM API.
function displayImages(data) {
  var sampElem = document.getElementById("sampleOutput");
  var messageElem = document.getElementById("message");
  sampElem.innerHTML = "";

  if (data.results.length == 0) {
    messageElem.innerText = "No images found.";
    return;
  }

  messageElem.innerText = "Found " + data.total + " images.";

  data.results.forEach(function (photo) {
    var photoDiv = document.createElement("div");
    photoDiv.className = "photo";

    var imageElem = document.createElement("img");
    imageElem.src = photo.urls.small;
    imageElem.alt = photo.alt_description || "Unsplash photo";
    imageElem.loading = "lazy";

    var nameElem = document.createElement("p");
    var photographerLink = document.createElement("a");
    photographerLink.href = photo.user.links.html;
    photographerLink.target = "_blank";
    photographerLink.rel = "noopener noreferrer";
    nameElem.appendChild(photographerLink);

    photoDiv.appendChild(imageElem);
    photoDiv.appendChild(nameElem);
    sampElem.appendChild(photoDiv);
  });
}

function showError(message) {
  document.getElementById("sampleOutput").innerHTML = "";
  document.getElementById("message").innerText = message;
}

function getSearchUrl() {
  var searchText = document.getElementById("inputBox").value.trim();
  if (searchText == "") {
    showError("Please enter a search word.");
    return null;
  }
  if (accessKey == "YOUR_ACCESS_KEY") {
    showError("Please add your Unsplash Access Key in script.js first.");
    return null;
  }
  document.getElementById("title").innerText = "Results for: " + searchText;
  document.getElementById("message").innerText = "Loading...";
  document.getElementById("sampleOutput").innerHTML = "";
  return (
    "https://api.unsplash.com/search/photos?query=" +
    encodeURIComponent(searchText) +
    "&per_page=12"
  );
}

function searchUsingXHR() {
  lastSearchMethod = searchUsingXHR;
  var url = getSearchUrl();
  if (url == null) return;

  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function () {
    if (this.readyState == 4) {
      if (this.status == 200) {
        var responseObj = JSON.parse(xhr.responseText);
        displayImages(responseObj);
      } else {
        showError("Request failed. HTTP status: " + this.status);
      }
    }
  };
  xhr.open("GET", url, true);
  xhr.setRequestHeader("Authorization", "Client-ID " + accessKey);
  xhr.send();
}

function searchUsingFetch() {
  lastSearchMethod = searchUsingFetch;
  var url = getSearchUrl();
  if (url == null) return;

  fetch(url, {
    headers: { Authorization: "Client-ID " + accessKey },
  })
    .then((response) => {
      if (!response.ok) throw new Error("HTTP status: " + response.status);
      return response.json();
    })
    .then((data) => {
      displayImages(data);
    })
    .catch((error) => {
      showError("Request failed: " + error.message);
    });
}

async function searchUsingFetchAwaitAsync() {
  lastSearchMethod = searchUsingFetchAwaitAsync;
  var url = getSearchUrl();
  if (url == null) return;

  try {
    let response = await fetch(url, {
      headers: { Authorization: "Client-ID " + accessKey },
    });
    if (!response.ok) throw new Error("HTTP status: " + response.status);

    let data = await response.json();
    displayImages(data);
  } catch (error) {
    showError("Request failed: " + error.message);
  }
}

// Handle the Enter keyboard event as required in the lab.
document
  .getElementById("inputBox")
  .addEventListener("keydown", function (event) {
    if (event.key == "Enter") {
      lastSearchMethod();
    }
  });

</script>
</html>
