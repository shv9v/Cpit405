body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    color: #333;
    margin: 0;
    padding: 0;
}

.container {
    width: 80%;
    margin: 0 auto;
    padding: 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#search {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 200px;
    margin-right: 10px;
}

#team-filter {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 150px;
}

.table-filters {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: left;
}

th {
    cursor: pointer;
}

.dark-mode {
    background-color: #333;
    color: #f4f4f4;
}

.dark-mode table {
    border-color: #555;
}

.dark-mode th,
.dark-mode td {
    border-color: #555;
}
body.dark-mode {
    background-color: #222;
    color: white;
}

body.dark-mode .container {
    background-color: #333;
}

body.dark-mode table {
    background-color: #333;
    color: white;
}

body.dark-mode th,
body.dark-mode td {
    border-color: #666;
}

body.dark-mode th {
    background-color: #444;
}

body.dark-mode tr:hover {
    background-color: #555;
}

body.dark-mode input,
body.dark-mode select {
    background-color: #444;
    color: white;
}
</style>

var tableBody = document.getElementById("player-rows");
var searchInput = document.getElementById("search");
var teamFilter = document.getElementById("team-filter");
var darkModeButton = document.getElementById("dark-mode-toggle");

// Display players in the table
function displayPlayers(players) {
    tableBody.innerHTML = "";

    players.forEach(function(player) {
        var row = document.createElement("tr");

        var name = document.createElement("td");
        name.innerText = player.name;
        row.appendChild(name);

        var team = document.createElement("td");
        team.innerText = player.team;
        row.appendChild(team);

        var points = document.createElement("td");
        points.innerText = player.points;
        row.appendChild(points);

        var rebounds = document.createElement("td");
        rebounds.innerText = player.rebounds;
        row.appendChild(rebounds);

        var assists = document.createElement("td");
        assists.innerText = player.assists;
        row.appendChild(assists);

        tableBody.appendChild(row);
    });
}

// Add teams to the dropdown
function displayTeams() {
    var teams = [];

    data.forEach(function(player) {
        if (!teams.includes(player.team)) {
            teams.push(player.team);

            var option = document.createElement("option");
            option.value = player.team;
            option.innerText = player.team;

            teamFilter.appendChild(option);
        }
    });
}

// Search and filter players
function filterPlayers() {
    var searchValue = searchInput.value.toLowerCase();
    var selectedTeam = teamFilter.value;

    var filteredPlayers = data.filter(function(player) {
        var matchName = player.name.toLowerCase().includes(searchValue);
        var matchTeam = selectedTeam == "all" || player.team == selectedTeam;

        return matchName && matchTeam;
    });

    displayPlayers(filteredPlayers);
}

// Search event
searchInput.addEventListener("input", function() {
    filterPlayers();
});

// Team filter event
teamFilter.addEventListener("change", function() {
    filterPlayers();
});

// Dark mode event
darkModeButton.addEventListener("click", function() {
    document.body.classList.toggle("dark-mode");
});

// Display initial data
displayTeams();
displayPlayers(data);
